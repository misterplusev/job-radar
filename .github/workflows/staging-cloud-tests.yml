name: isolated-staging-control-tests
on:
  push:
    branches: [codex/recurring-staging-20261117]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5
      - name: Persistent state, cadence, lease, budget and isolation checks
        run: node --test runtime/staging/test_staging.mjs
      - name: Source request sandbox tests
        env:
          PYTHONPATH: runtime/staging/runner
        run: python -m unittest discover -s runtime/staging/runner -p 'test_network_guard.py' -v
