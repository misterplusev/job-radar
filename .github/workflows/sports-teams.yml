name: sports-teams-jobs
run-name: sports-teams ${{ inputs.scheduler_slot || github.event_name }}
on:
  workflow_dispatch:
    inputs:
      scheduler_slot:
        description: UTC hourly slot assigned by the Cloudflare scheduler
        type: string
        required: false
      trigger_source:
        description: Dispatch origin
        type: string
        default: manual
        required: false
      detail_limit:
        description: 'Detail-page batch (0 verifies sources using cached descriptions)'
        type: choice
        options: ['250', '0']
        default: '250'
      recover_pending:
        description: 'Recover missed individual alerts from the paused repair runs'
        type: boolean
        default: false
# Cloudflare Durable Object alarms own hourly dispatch at :23 UTC.
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: sports-teams-jobs
  cancel-in-progress: false
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: sports_teams
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DISCORD_WEBHOOK_TEAMS: ${{ secrets.DISCORD_WEBHOOK_TEAMS }}
      NOTIFICATIONS_PAUSED: '0'
      JOBRADAR_SCHEDULER_SLOT: ${{ inputs.scheduler_slot }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Regression checks
        run: python -m unittest discover -p 'test_*.py'
      - name: Scrape and persist all supported sources
        id: scrape
        run: python -u pipeline_local.py --cloud --trigger '${{ inputs.trigger_source || github.event_name }}' --detail-limit '${{ github.event.inputs.detail_limit || 250 }}' ${{ github.event.inputs.recover_pending == 'true' && '--recover-pending' || '' }}
      - name: Notification guard and delivery
        id: delivery
        continue-on-error: true
        run: |
          if [ "$NOTIFICATIONS_PAUSED" = "0" ]; then
            python publish_teams.py --post --limit 0
          else
            echo "Notifications paused by runtime configuration."
          fi
      - name: Prepare live board and health receipt
        run: |
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          out=Path('out');out.mkdir(exist_ok=True)
          out.joinpath('index.html').write_text(Path('board/live.html').read_text().replace('api/health','health.json'))
          shutil.copy2('board/job-board-core.mjs',out/'job-board-core.mjs')
          for asset in ['standalone.css','standalone-ui.mjs']:shutil.copy2(Path('board')/asset,out/asset)
          shutil.copy2('board/team_jobs.json',out/'team_jobs.json')
          shutil.copy2('board/coverage.json',out/'coverage.json')
          shutil.copy2('board/coverage.html',out/'coverage.html')
          evidence=Path('verification-20261111')
          if evidence.exists():shutil.copytree(evidence,out/'verification-20261111',dirs_exist_ok=True)
          m=json.loads(Path('data/runtime/latest_scrape_manifest.json').read_text())
          delivery='${{ steps.delivery.outcome }}'
          health={'service':'abet-sports-teams-jobs','runtime':'github-actions','status':m['overall_status'] if delivery=='success' else 'degraded','last_run_end':m['generated_at'],'notifications_paused':False,'delivery_status':delivery,'schedule':{'owner':'cloudflare-durable-object-alarm','minute_utc':23,'timezone':'UTC','health_url':'https://abet-jobs-scheduler.abetscrape.workers.dev/health'},'latest_manifest':m}
          out.joinpath('health.json').write_text(json.dumps(health,indent=2))
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sports_teams/out
      - uses: actions/deploy-pages@v4
        id: deployment
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sports-teams-scrape-receipt
          path: sports_teams/data/runtime/latest_scrape_manifest.json
      - name: Surface source failures
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('data/runtime/latest_scrape_manifest.json').read_text())
          print(json.dumps(m['totals']))
          if m['runtime_status']!='healthy':raise SystemExit('Source failures: see published health receipt')
          if m['career_link_audit_status']!='verified':print('::warning::Career-link audit remains partial; see coverage.json. Overall health remains degraded until all links are proved.')
          if '${{ steps.delivery.outcome }}'!='success':raise SystemExit('Delivery incomplete; unsent jobs remain queued')
          PY
