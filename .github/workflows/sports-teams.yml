name: sports-teams-jobs
run-name: sports-teams ${{ inputs.scheduler_slot || github.event_name }}
on:
  workflow_dispatch:
    inputs:
      scheduler_slot:
        description: UTC hourly slot assigned by the Cloudflare scheduler
        type: string
        required: false
      trigger_source:
        description: Dispatch origin
        type: string
        default: manual
        required: false
      detail_limit:
        description: 'Detail-page batch (0 verifies sources using cached descriptions)'
        type: choice
        options: ['250', '0']
        default: '250'
      recover_pending:
        description: 'Recover missed individual alerts from the paused repair runs'
        type: boolean
        default: false
      max_listing_age_minutes:
        description: Collect the Workday listing first when the saved one is older than this many minutes
        required: false
        default: '60'
        type: string
# Cloudflare Durable Object alarms own hourly dispatch at :23 UTC.
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: sports-teams-jobs
  cancel-in-progress: false
jobs:
  # The Workday boards refuse direct requests from cloud runners (HTTP 429 security check), so every run reads the
  # saved listing collected by workday-careers.yml. The scraper accepts a listing up to 180 minutes old. This job
  # measures its age; when it is older than the limit the collection runs first. The limit here is 60 minutes, not
  # robotics' 150: the sportsbook scraper starts 37 minutes after this run and cannot collect the listing itself,
  # so this run must leave a listing that is still under 180 minutes old when sportsbook reads it. That holds
  # for scheduled and hand-started runs alike, so no scraper depends on another scraper's run having happened.
  listing_age:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      stale: ${{ steps.age.outputs.stale }}
    steps:
      - id: age
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_MINUTES: ${{ inputs.max_listing_age_minutes || '60' }}
        run: |
          newest=$(gh api "repos/misterplusev/job-radar/releases/tags/abet-workday-listings-v1" \
            --jq '[.assets[] | select(.state == "uploaded") | .name | select(test("^listings-[0-9]+-[0-9]+\\.json\\.gz$")) | split("-")[1] | tonumber] | max // 0' || echo 0)
          case "$newest" in ''|*[!0-9]*) newest=0 ;; esac
          age=$(( ( $(date +%s) - newest ) / 60 ))
          if [ "$age" -gt "$MAX_MINUTES" ]; then stale=true; else stale=false; fi
          echo "Saved Workday listing is $age minutes old (limit $MAX_MINUTES): stale=$stale"
          echo "stale=$stale" >> "$GITHUB_OUTPUT"
  official_workday:
    needs: listing_age
    if: ${{ needs.listing_age.outputs.stale == 'true' && vars.WORKDAY_CLOUD_BROWSER_ENABLED == '1' }}
    permissions: {contents: write, actions: read}
    uses: ./.github/workflows/workday-careers.yml
    with: {mode: collect}
  scrape:
    needs: [listing_age, official_workday]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: sports_teams
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DISCORD_WEBHOOK_TEAMS: ${{ secrets.DISCORD_WEBHOOK_TEAMS }}
      NOTIFICATIONS_PAUSED: '0'
      JOBRADAR_SCHEDULER_SLOT: ${{ inputs.scheduler_slot }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Regression checks
        run: python -m unittest discover -p 'test_*.py'
      - name: Fetch verified career listings for this cloud runner
        continue-on-error: true
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python ${{ github.workspace }}/runtime/workday/preload_workday.py
      - name: Scrape and persist all supported sources
        id: scrape
        env:
          WORKDAY_LISTINGS_ENABLED: '1'
          TEAMWORK_DETAIL_EVIDENCE_DIR: data/runtime/teamwork-detail
          TRIGGER_SOURCE: ${{ inputs.trigger_source || github.event_name }}
        run: python -u pipeline_local.py --cloud --trigger "$TRIGGER_SOURCE" --detail-limit '${{ github.event.inputs.detail_limit || 250 }}' ${{ github.event.inputs.recover_pending == 'true' && '--recover-pending' || '' }}
      - name: Notification guard and delivery
        id: delivery
        continue-on-error: true
        run: |
          if [ "$NOTIFICATIONS_PAUSED" = "0" ]; then
            python publish_teams.py --post --limit 0
          else
            echo "Notifications paused by runtime configuration."
          fi
      - name: Prepare live board and health receipt
        run: |
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          out=Path('out');out.mkdir(exist_ok=True)
          out.joinpath('index.html').write_text(Path('board/live.html').read_text().replace('api/health','health.json'))
          shutil.copy2('board/job-board-core.mjs',out/'job-board-core.mjs')
          for asset in ['standalone.css','standalone-ui.mjs']:shutil.copy2(Path('board')/asset,out/asset)
          shutil.copy2('board/team_jobs.json',out/'team_jobs.json')
          shutil.copy2('board/coverage.json',out/'coverage.json')
          shutil.copy2('board/coverage.html',out/'coverage.html')
          evidence=Path('verification-20261111')
          if evidence.exists():shutil.copytree(evidence,out/'verification-20261111',dirs_exist_ok=True)
          m=json.loads(Path('data/runtime/latest_scrape_manifest.json').read_text())
          delivery='${{ steps.delivery.outcome }}'
          health={'service':'abet-sports-teams-jobs','runtime':'github-actions','status':m['overall_status'] if delivery=='success' else 'degraded','last_run_end':m['generated_at'],'notifications_paused':False,'delivery_status':delivery,'schedule':{'owner':'cloudflare-durable-object-alarm','minute_utc':23,'timezone':'UTC','health_url':'https://abet-jobs-scheduler.abetscrape.workers.dev/health'},'latest_manifest':m}
          out.joinpath('health.json').write_text(json.dumps(health,indent=2))
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sports_teams/out
      - uses: actions/deploy-pages@v4
        id: deployment
      # One row per run in public.job_system_log: database size, rows and active rows per job table, run-log sizes,
      # sources that failed in the last 24 hours, jobs waiting for Discord. It cannot fail the run.
      - name: Log database size and table counts
        if: ${{ always() }}
        working-directory: ${{ github.workspace }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        # This call writes the system log row and runs the retention pass. Until 2026-11-19 the step could
        # not fail (continue-on-error, output piped to head), so two cancelled calls went unseen in green runs.
        # It now tries three times and fails the job unless the reply says the row was written.
        run: |
          for attempt in 1 2 3; do
            code=$(curl -sS --max-time 60 -o log_reply.json -w '%{http_code}' -X POST "$SUPABASE_URL/rest/v1/rpc/log_job_system" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Content-Type: application/json" -d '{"p_source":"sports_teams"}' || true)
            head -c 400 log_reply.json 2>/dev/null; echo
            if [ "$code" = "200" ] && grep -q '"logged" *: *true' log_reply.json && ! grep -q '"error"' log_reply.json; then exit 0; fi
            echo "system log call attempt $attempt failed (HTTP $code)"; sleep 10
          done
          echo "::error::The system log row was not written, or the retention pass reported an error"
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sports-teams-scrape-receipt
          path: |
            sports_teams/data/runtime/latest_scrape_manifest.json
            sports_teams/data/runtime/workday-http/*.jsonl
            sports_teams/data/runtime/teamwork-detail/*.json
          retention-days: 7
      - name: Surface source failures
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('data/runtime/latest_scrape_manifest.json').read_text())
          print(json.dumps(m['totals']))
          if m['runtime_status']!='healthy':raise SystemExit('Source failures: see published health receipt')
          if m['career_link_audit_status']!='verified':print('::warning::Career-link audit remains partial; see coverage.json. Overall health remains degraded until all links are proved.')
          if '${{ steps.delivery.outcome }}'!='success':raise SystemExit('Delivery incomplete; unsent jobs remain queued')
          PY
