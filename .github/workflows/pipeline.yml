name: sports-teams-cloud-connectivity
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Verify public Teamwork source from the robotics/tech runtime
        run: |
          python - <<'PY'
          import requests
          u='https://www.teamworkonline.com/basketball-jobs/nbateamjobs'
          r=requests.get(u,headers={'User-Agent':'ABET-TeamsJobs/1.0'},timeout=30)
          print('TEAMWORK_HTTP',r.status_code,'BYTES',len(r.content),'CARDS',r.text.count('organization-portal__job-title'))
          r.raise_for_status()
          assert 'organization-portal__job-title' in r.text
          PY
