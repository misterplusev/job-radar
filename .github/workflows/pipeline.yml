name: sports-teams-cloud-connectivity
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r sports_teams/requirements.txt
      - name: Check detail extraction with production code
        working-directory: sports_teams
        run: |
          python - <<'PY'
          from enrichment import fetch_detail
          from live_refresh import BoundedSession
          from providers.teamwork import UA
          original_init=BoundedSession.__init__
          def initialize(self):
              original_init(self);self.headers.update(UA)
          BoundedSession.__init__=initialize
          urls=['https://www.teamworkonline.com/baseball-jobs/philadelphia-phillies-baseball-ops/philadelphia-phillies-baseball-ops/minor-league-assistant-pitching-coach-2198771','https://www.teamworkonline.com/basketball-jobs/nbateamjobs/dallas-wings/it-manager-2196126']
          for url in urls:
              try:
                  d=fetch_detail({'url':url});print('OK',url,len(d['description']),d['posted_at'])
              except Exception as e:print('FAILED',url,type(e).__name__,str(e)[:400])
          PY
