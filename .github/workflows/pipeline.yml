name: job-radar-pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */3 * * *"   # every 3 hours

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run pipeline (ingest -> score -> alert)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DISCORD_JOB_RADAR_WEBHOOK: ${{ secrets.DISCORD_JOB_RADAR_WEBHOOK }}
          # ANTHROPIC_API_KEY / ANTHROPIC_MODEL deliberately NOT passed.
          # score.py:11 does `use_claude = bool(settings.ANTHROPIC_API_KEY)`,
          # so withholding it routes scoring to the FREE heuristic judge in
          # jobradar/matcher/judge.py. The repo secrets are untouched; restore
          # paid scoring by reverting this commit.
          ALERT_MIN_SCORE: ${{ secrets.ALERT_MIN_SCORE }}
        run: |
          python run.py pipeline
      - name: Render dashboard artifact
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python run.py render --out out/dashboard.html
      - uses: actions/upload-artifact@v4
        with:
          name: job-radar-dashboard
          path: out/dashboard.html
