name: jobs-schema-read-only-audit
on: workflow_dispatch
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Read only job table catalogs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          python - <<'PY'
          import os,json,requests
          from pathlib import Path
          project=os.environ['SUPABASE_PROJECT_REF']
          assert project=='alxgteasytezekyunyjk'
          sql=Path('docs/job-scrapers/export_job_schema.sql').read_text()
          r=requests.post(f'https://api.supabase.com/v1/projects/{project}/database/query',headers={'Authorization':'Bearer '+os.environ['SUPABASE_ACCESS_TOKEN']},json={'query':sql},timeout=60)
          if not r.ok:raise RuntimeError(f'Catalog read failed: HTTP {r.status_code}')
          data=r.json()[0]['catalog']
          Path('job_schema_catalog.json').write_text(json.dumps(data,indent=2))
          print('Catalog exported:',len(data['relations']),'relations',len(data['columns']),'columns; no job/application rows')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: job-schema-catalog
          path: job_schema_catalog.json
          retention-days: 7
