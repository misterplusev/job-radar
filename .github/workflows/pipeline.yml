name: sports-teams-cloud-bootstrap
on: workflow_dispatch
permissions:
  contents: read
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Apply only sports teams schema
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python - <<'PY'
          import os, requests
          from pathlib import Path
          expected='alxgteasytezekyunyjk'
          assert expected in os.environ['SUPABASE_URL'], 'Unexpected database project'
          assert os.environ['SUPABASE_PROJECT_REF']==expected, 'Unexpected migration project'
          r=requests.post(f'https://api.supabase.com/v1/projects/{expected}/database/query', headers={'Authorization':'Bearer '+os.environ['SUPABASE_ACCESS_TOKEN']}, json={'query':Path('db/schema_sports_teams.sql').read_text()}, timeout=90)
          if not r.ok: raise RuntimeError(f'Migration HTTP {r.status_code}: {r.text[:300]}')
          print('Sports teams schema applied. Existing runtime database secrets reused.')
          PY
