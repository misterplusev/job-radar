name: teams-source-evidence
on: workflow_dispatch
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python runtime/teams_source_evidence.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: teams-source-evidence
          path: evidence
