name: sportsbook-deliver
run-name: sportsbook-deliver ${{ inputs.scheduler_slot || github.event_name }}
# The ONE sender of sportsbook job messages. Started by the Cloudflare scheduler after each
# sportsbook scrape slot; no timer of its own. It drains sportsbook_job_notifications with the
# same code that delivers robotics jobs (jobradar/publish.py) and records Discord message IDs.
on:
  workflow_dispatch:
    inputs:
      scheduler_slot:
        description: UTC slot assigned by the Cloudflare scheduler
        type: string
        required: false
      trigger_source:
        description: Dispatch origin
        type: string
        default: manual
        required: false
permissions:
  contents: read
concurrency:
  group: sportsbook-deliver
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Regression checks
        run: python -m unittest discover -s tests -v
      - name: Deliver queued sportsbook jobs to Discord
        env:
          JOBRADAR_MODULE: sportsbook
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DISCORD_WEBHOOK_JOBS: ${{ secrets.DISCORD_WEBHOOK_SPORTSBOOK }}
          JOBRADAR_SCHEDULER_SLOT: ${{ inputs.scheduler_slot }}
          JOBRADAR_TRIGGER: ${{ inputs.trigger_source }}
        run: python -u run.py deliver
      # One row per run in public.job_system_log: database size, rows and active rows per job table, run-log sizes,
      # sources that failed in the last 24 hours, jobs waiting for Discord. It cannot fail the run.
      - name: Log database size and table counts
        if: ${{ always() }}
        working-directory: ${{ github.workspace }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        # This call writes the system log row and runs the retention pass. Until 2026-11-19 the step could
        # not fail (continue-on-error, output piped to head), so two cancelled calls went unseen in green runs.
        # It now tries three times and fails the job unless the reply says the row was written.
        run: |
          for attempt in 1 2 3; do
            code=$(curl -sS --max-time 60 -o log_reply.json -w '%{http_code}' -X POST "$SUPABASE_URL/rest/v1/rpc/log_job_system" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Content-Type: application/json" -d '{"p_source":"sportsbook"}' || true)
            head -c 400 log_reply.json 2>/dev/null; echo
            if [ "$code" = "200" ] && grep -q '"logged" *: *true' log_reply.json && ! grep -q '"error"' log_reply.json; then exit 0; fi
            echo "system log call attempt $attempt failed (HTTP $code)"; sleep 10
          done
          echo "::error::The system log row was not written, or the retention pass reported an error"
          exit 1
