name: sports-teams-notification-audit
on: workflow_dispatch
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r sports_teams/requirements.txt
      - name: Regression checks without publishing
        working-directory: sports_teams
        run: python -m unittest discover -p 'test_*.py'
      - name: Inspect delivery state without publishing
        working-directory: sports_teams
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DISCORD_WEBHOOK_TEAMS: ${{ secrets.DISCORD_WEBHOOK_TEAMS }}
        run: python notification_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: sports-teams-notification-audit
          path: sports_teams/notification_audit.json
