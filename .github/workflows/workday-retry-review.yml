name: Validate Workday publication, official consumer paths and deployment workflow
on: workflow_dispatch
permissions: {contents: read, actions: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with: {name: workday-full-listing-proof, path: captured, run-id: 44224552245, github-token: '${{ github.token }}'}
      - run: pip install requests PyYAML
      - run: python runtime/workday/seal.py captured runtime/workday/catalog.json proof/listings.json.gz
      - run: python -m unittest discover -s runtime/workday -p 'test_snapshot_release.py' -v
      - run: python -c "import yaml,pathlib; [yaml.safe_load(p.read_text()) for p in pathlib.Path('.github/workflows').glob('*.yml')]"
      - uses: actions/upload-artifact@v4
        with: {name: accepted-public-listings, path: proof/listings.json.gz, retention-days: 3}
