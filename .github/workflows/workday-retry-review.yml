name: Read production job modules and employer careers metadata
on: workflow_dispatch
permissions: {contents: read}
jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Read the four boards and public tables using the published anonymous client
        run: python3 runtime/verification/read_jobs_frontends.py
      - uses: actions/upload-artifact@v4
        with:
          name: public-job-board-evidence
          path: http-acceptance.json
          retention-days: 14
