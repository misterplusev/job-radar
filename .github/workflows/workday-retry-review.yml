name: Inspect employer career links
on: workflow_dispatch
permissions: {contents: read}
jobs:
  assess:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: pip install requests beautifulsoup4
      - run: python runtime/verification/official_routes.py
      - uses: actions/upload-artifact@v4
        with: {name: employer-career-links, path: official-routes.json, retention-days: 14}
