name: Isolated team detail acceptance
on: workflow_dispatch
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt -r sports_teams/requirements.txt
      - name: Exercise normal team ingestion, enrichment and delivery fixtures
        working-directory: sports_teams
        env: {PYTHONPATH: '../runtime/verification/isolation:..', STAGING_TEST_NETWORK_OFF: '1'}
        run: python -m unittest discover -p 'test_*.py' -v
