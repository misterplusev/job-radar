name: Verify employer-published Cubs front-office job details
on: workflow_dispatch
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: pip install -r requirements.txt -r sports_teams/requirements.txt
      - run: cd sports_teams && PYTHONPATH=.. python -m unittest discover -p 'test_*.py' -v
      - name: Verify every current Cubs front-office vacancy through the changed detail adapter
        env: {WORKDAY_LISTINGS_ENABLED: '1', PYTHONPATH: '.'}
        run: python runtime/verification/cubs_live.py
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with: {name: cubs-official-details, path: cubs-details.json, retention-days: 7}
