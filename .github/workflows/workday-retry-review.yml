name: workday-source-diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: workday-cloud-development
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5
      - run: python runtime/verification/diagnose_workday.py
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: workday-source-diagnosis
          path: proof/workday-diagnosis/
          retention-days: 7
