name: Check official job-detail HTML
on: workflow_dispatch
permissions: {contents: read, actions: read}
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with: {name: accepted-public-listings, path: input, run-id: 44231554343, github-token: '${{ github.token }}'}
      - run: pip install requests beautifulsoup4
      - run: python runtime/verification/public_detail_check.py
      - uses: actions/upload-artifact@v4
        with: {name: official-role-detail-check, path: detail-evidence.json, retention-days: 7}
