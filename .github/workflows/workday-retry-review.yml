name: Verify current Kambi and Chalkboard official recruiting sources
on: workflow_dispatch
permissions: {contents: read}
jobs:
  shape:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - run: python runtime/verification/kambi_chalk_source.py
      - uses: actions/upload-artifact@v4
        with: {name: employer-source-shapes, path: employer-source-shapes.json}
