name: Isolated team enrichment recovery
on: workflow_dispatch
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r sports_teams/requirements.txt -r requirements.txt
      - name: Test agency denials, other employers, reopened retries and the Hawks detail path
        working-directory: sports_teams
        env: {PYTHONPATH: '..'}
        run: python -m unittest discover -p 'test_*.py' -v
