name: Verify production scheduler alert against isolated receiver
on: workflow_dispatch
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: node --test runtime/cloudflare/test_scheduler.mjs runtime/cloudflare/test_alarm.mjs
