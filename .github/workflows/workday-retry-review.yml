name: workday-session-http-compatibility
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: workday-cloud-development
  cancel-in-progress: false
jobs:
  session-http:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests
      - name: Normal HTTP session initialization only; no browser or production credentials
        run: python runtime/verification/probe_workday_session.py
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: workday-http-session-proof
          path: proof/session-http/
          retention-days: 7
