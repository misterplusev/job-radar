name: Read back real job message receipts
on: workflow_dispatch
permissions: {contents: read}
jobs:
  read:
    strategy:
      matrix: {module: [robotics, sports_teams]}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: pip install requests
      - name: Compare database receipt with the actual Discord post
        env:
          MODULE: ${{ matrix.module }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JOB_WEBHOOK: ${{ matrix.module == 'sports_teams' && secrets.DISCORD_WEBHOOK_TEAMS || secrets.DISCORD_WEBHOOK_JOBS }}
        run: python runtime/verification/discord_by_module.py
      - uses: actions/upload-artifact@v4
        with: {name: 'discord-${{ matrix.module }}', path: 'discord-*.json', retention-days: 7}
