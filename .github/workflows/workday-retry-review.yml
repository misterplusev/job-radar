name: Inspect prior hosted team-board snapshots for verified descriptions
on: workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Match exact live job identities to prior published records
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python runtime/verification/archived_team_detail.py
      - uses: actions/upload-artifact@v4
        with:
          name: archived-team-detail-evidence
          path: history-proof/
          retention-days: 14
