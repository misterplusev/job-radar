<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ABET Sports Teams Jobs</title><style>
:root{color-scheme:dark}body{font:15px system-ui;background:#0c1119;color:#e7edf5;margin:0;padding:24px}header{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap}h1{margin:0}a{color:#7cbfff}p,small{color:#9cadbf}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}input,select,button{font:inherit;padding:9px;background:#182332;color:inherit;border:1px solid #34475d;border-radius:6px}.card{background:#131e2b;border:1px solid #2a3d52;padding:18px;margin:10px 0;border-radius:8px}.top{display:flex;gap:12px;align-items:center}.logo{height:30px;width:30px;object-fit:contain}.badge{color:#83e3ba;font-size:12px}.description{white-space:pre-wrap;line-height:1.6;margin-top:12px}.meta{margin:8px 0;color:#b1bfd0}.status{color:#ffcc80}.hidden{display:none}button{cursor:pointer}#q{min-width:280px;flex:1}summary{cursor:pointer;color:#7cbfff}footer{margin:24px 0;color:#9cadbf}
</style></head><body><header><div><h1>Sports Teams Jobs</h1><p>NFL · NBA · MLB · NHL</p></div><div><a href="api/health">Scraper health</a><p id="fresh">Loading live jobs…</p></div></header>
<div class="controls"><input id="q" placeholder="Search jobs, teams, locations or descriptions" aria-label="Search"><select id="league" aria-label="League"><option value="">All leagues</option></select><select id="team" aria-label="Team"><option value="">All teams</option></select><select id="source" aria-label="Source"><option value="">All sources</option></select><select id="sort" aria-label="Sort"><option value="new">Newest discovered</option><option value="posted">Employer posting date</option><option value="team">Team</option></select><label><input type="checkbox" id="unapplied"> Hide marked applications</label></div>
<p id="count"></p><p class="status" id="health"></p><main id="jobs"></main><button id="more" class="hidden">Show more</button><footer>Application marks are private to this browser. A mark does not submit an application. “New” means discovered within 48 hours; missing employer dates stay unknown.</footer>
<script>
const el=id=>document.getElementById(id);let jobs=[],shown=50;
const marks=()=>{try{return new Set(JSON.parse(localStorage.getItem('abet.team.applications')||'[]'))}catch{return new Set()}};
function node(tag,text,cls){const n=document.createElement(tag);if(text!=null)n.textContent=text;if(cls)n.className=cls;return n}
function safeURL(value){try{const u=new URL(value);return ['https:','http:'].includes(u.protocol)?u.href:null}catch{return null}}
function date(value){return value?new Date(value).toLocaleDateString():'Unknown'}
function fill(id,values){[...new Set(values.filter(Boolean))].sort().forEach(v=>{const o=node('option',v);o.value=v;el(id).append(o)})}
function render(){const marked=marks(),query=el('q').value.toLowerCase();let out=jobs.filter(j=>(!el('league').value||j.league===el('league').value)&&(!el('team').value||j.team===el('team').value)&&(!el('source').value||j.platform===el('source').value)&&(!el('unapplied').checked||!marked.has(j.url))&&(!query||[j.title,j.team,j.location,j.description].join(' ').toLowerCase().includes(query)));
out.sort((a,b)=>el('sort').value==='team'?a.team.localeCompare(b.team):String(b[el('sort').value==='posted'?'posted_at':'first_seen_at']||'').localeCompare(String(a[el('sort').value==='posted'?'posted_at':'first_seen_at']||'')));
el('count').textContent=`${out.length.toLocaleString()} matching jobs · ${jobs.length.toLocaleString()} active`;el('jobs').replaceChildren();
for(const j of out.slice(0,shown)){const card=node('article',null,'card'),top=node('div',null,'top');const logo=safeURL(j.logo||j.logo_url);if(logo){const img=node('img');img.className='logo';img.src=logo;img.alt='';top.append(img)}const link=node('a',j.title);link.href=safeURL(j.url)||'#';link.target='_blank';link.rel='noopener noreferrer';top.append(link);if(j.new)top.append(node('span','NEW','badge'));card.append(top,node('div',`${j.team} · ${j.location||'Location unspecified'} · ${j.platform||'Source unspecified'}`,'meta'),node('small',`Posted: ${date(j.posted_at)} · First seen: ${date(j.first_seen_at)}`));
const detail=node('details');detail.append(node('summary','Job description'),node('div',j.description||'Full description unavailable. Open the employer posting for details.','description'));card.append(detail);const button=node('button',marked.has(j.url)?'Applied ✓':'Mark applied');button.addEventListener('click',()=>{const s=marks();s.has(j.url)?s.delete(j.url):s.add(j.url);localStorage.setItem('abet.team.applications',JSON.stringify([...s]));render()});card.append(button);el('jobs').append(card)}el('more').classList.toggle('hidden',shown>=out.length)}
['q','league','team','source','sort','unapplied'].forEach(id=>el(id).addEventListener(id==='q'?'input':'change',()=>{shown=50;render()}));el('more').addEventListener('click',()=>{shown+=50;render()});
async function load(){try{const r=await fetch('team_jobs.json',{cache:'no-store'});if(!r.ok)throw Error('Job feed unavailable');const data=await r.json();jobs=data.jobs;fill('league',jobs.map(j=>j.league));fill('team',jobs.map(j=>j.team));fill('source',jobs.map(j=>j.platform));el('fresh').textContent=`Updated ${new Date(data.generated_at).toLocaleString()}`;render()}catch(e){el('fresh').textContent=e.message}try{const r=await fetch('api/health',{cache:'no-store'});if(!r.ok)return;const h=await r.json();const m=h.latest_manifest||{},t=m.totals||{};el('health').textContent=`Scraper: ${h.status}. ${t.successful||0}/${t.providers||0} sources successful. ${m.details?.pending||0} descriptions pending.${h.notifications_paused?' Notifications paused.':''}`}catch{}}
load();
</script></body></html>
